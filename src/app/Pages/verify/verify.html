<main class="auth">

  <a routerLink="/home" class="brand">
    <img src="assets/logo_bloom.png" alt="Bloom, ir al inicio">
  </a>

  <section class="auth-card verify-card" aria-labelledby="verify-title">
    <h1 id="verify-title" class="auth-title">Verifica tu correo</h1>

    <p class="lead">
      Enviamos un código de 7 caracteres a
      <strong>{{ email() }}</strong>.
    </p>

    <form (submit)="$event.preventDefault(); onSubmit()" novalidate>

      <div class="field">
        <label for="code">Código de verificación</label>
        <input id="code" type="text" class="code-input" [formControl]="code"
               maxlength="7" autocomplete="one-time-code" spellcheck="false"
               autocapitalize="off"
               [attr.aria-invalid]="error() ? 'true' : null"
               [attr.aria-describedby]="error() ? 'code-error' : null">
        @if (error(); as msg) {
          <p id="code-error" class="error" role="alert">{{ msg }}</p>
        }
      </div>

      @if (serverError(); as msg) {
        <p class="server-error" role="alert">{{ msg }}</p>
      }

      <button type="submit" class="btn-submit" [disabled]="sending()">
        {{ sending() ? 'Verificando…' : 'Verificar' }}
      </button>
    </form>

    <p class="auth-switch">
      @if (cooldown() > 0) {
        Podrás pedir otro código en {{ cooldown() }} s
      } @else {
        ¿No te llegó? <button type="button" class="link-btn" (click)="resend()">Reenviar código</button>
      }
    </p>
    <p class="auth-switch">
      ¿Escribiste mal el correo? <a routerLink="/register">Volver al registro</a>
    </p>
  </section>

</main>
