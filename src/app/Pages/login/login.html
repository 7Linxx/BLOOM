<main class="auth">

  <a routerLink="/home" class="brand">
    <img src="assets/logo_bloom.png" alt="Bloom, ir al inicio">
  </a>

  <section class="auth-card login-card" aria-labelledby="login-title">
    <h1 id="login-title" class="auth-title">Login</h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <div class="field">
        <label for="email">Correo Electrónico</label>
        <input id="email" type="email" formControlName="email"
               autocomplete="email"
               [attr.aria-invalid]="showError(email) ? 'true' : null"
               [attr.aria-describedby]="showError(email) ? 'email-error' : null">
        @if (showError(email)) {
          <p id="email-error" class="error" role="alert">
            {{ email.hasError('required') ? 'Escribe tu correo.' : 'Escribe un correo válido.' }}
          </p>
        }
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password"
               autocomplete="current-password"
               [attr.aria-invalid]="showError(password) ? 'true' : null"
               [attr.aria-describedby]="showError(password) ? 'password-error' : null">
        @if (showError(password)) {
          <p id="password-error" class="error" role="alert">Escribe tu contraseña.</p>
        }
      </div>

      <button type="submit" class="btn-submit">Ingresar</button>
    </form>

    <p class="auth-switch">
      ¿No tienes cuenta? <a routerLink="/register">Regístrate</a>
    </p>
  </section>

</main>
